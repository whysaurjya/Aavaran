<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#DCFCE7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F485F"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F485F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Soft Circles -->
  <circle cx="300" cy="240" r="210" fill="url(#bgGrad)"/>
  <circle cx="300" cy="240" r="160" fill="none" stroke="#86EFAC" stroke-width="2" stroke-dasharray="6 8" opacity="0.7"/>
  <circle cx="300" cy="240" r="120" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.5"/>

  <!-- Orbiting Satellites / Nodes -->
  <circle cx="140" cy="180" r="22" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <path d="M133 175h14v10h-14z" fill="#166534"/>
  <circle cx="140" cy="180" r="7" fill="#22C55E"/>

  <circle cx="460" cy="170" r="26" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <path d="M451 170l9-10 9 10-9 10z" fill="#22C55E"/>

  <circle cx="430" cy="330" r="20" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <circle cx="430" cy="330" r="8" fill="#F59E0B"/>

  <circle cx="160" cy="320" r="24" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <path d="M152 320h16M160 312v16" stroke="#0F485F" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Floating Glass Card Background -->
  <rect x="180" y="90" width="240" height="300" rx="36" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="180" y="90" width="240" height="300" rx="36" fill="none" stroke="#E2ECE5" stroke-width="2"/>

  <!-- Shield Shape in Center -->
  <path d="M300 135 L370 170 V245 C370 295 300 335 300 335 C300 335 230 295 230 245 V170 Z" fill="url(#shieldGrad)"/>
  
  <!-- Glowing Inner Shield Lines -->
  <path d="M300 152 L354 180 V240 C354 278 300 312 300 312 C300 312 246 278 246 240 V180 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Central AI Pulse Core / Rocket / Gear -->
  <!-- Gear Outer -->
  <g transform="translate(300, 235)">
    <!-- Rotating Pulsing Waves -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#86EFAC" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="36" fill="#07271C"/>
    <!-- Glowing AI Spark Icon -->
    <path d="M0 -22 L5 -6 L21 0 L5 6 L0 22 L-5 6 L-21 0 L-5 -6 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Top Floating Sparkles -->
  <path d="M225 125 L228 133 L236 136 L228 139 L225 147 L222 139 L214 136 L222 133 Z" fill="#FBBF24"/>
  <path d="M375 115 L377 121 L383 123 L377 125 L375 131 L373 125 L367 123 L373 121 Z" fill="#22C55E"/>

  <!-- Bottom Floating Badge "LAUNCHING SOON" -->
  <g transform="translate(300, 360)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#shieldGrad)" stroke="#86EFAC" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="-62" cy="0" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-50" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">COMING SOON</text>
  </g>
</svg>
